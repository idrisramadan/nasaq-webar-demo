<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0d332e">
  <title>نَسَق | تجربة أفاتار الواقع المعزّز</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071b19; }
    .intro { position: fixed; z-index: 5; inset: 0 0 auto; padding: 16px 18px 14px; color: #fff; background: linear-gradient(180deg, rgba(7,27,25,.95), rgba(7,27,25,.6), transparent); pointer-events: none; }
    .intro h1 { margin: 0 0 3px; font-size: 22px; }
    .intro p { margin: 0; max-width: 54ch; font-size: 14px; line-height: 1.5; color: #e5eee9; }
    .card-link { display: inline-block; margin-top: 8px; padding: 8px 12px; border-radius: 10px; color: #102f2a; background: #d6bb6f; text-decoration: none; font-weight: 700; pointer-events: auto; }
    .status { position: fixed; z-index: 6; inset: auto 16px 22px; padding: 12px 14px; border: 1px solid rgba(255,255,255,.2); border-radius: 14px; background: rgba(7,27,25,.86); color: white; text-align: center; font-size: 14px; line-height: 1.5; backdrop-filter: blur(8px); }
    .badge { display: inline-block; margin-inline-start: 6px; padding: 2px 8px; border-radius: 20px; color: #122c27; background: #d9c178; font-size: 12px; font-weight: 700; }
    .hint { opacity: .86; font-size: 12px !important; margin-top: 4px !important; }
    a-scene { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <header class="intro">
    <h1>نَسَق <span class="badge">نموذج تقني</span></h1>
    <p>اسمحي للمتصفح باستخدام الكاميرا، ثم وجّهيها إلى بطاقة الاختبار.</p>
    <a class="card-link" href="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" target="_blank" rel="noopener">افتحي بطاقة الاختبار للطباعة</a>
    <p class="hint">الأفاتار تجريبي ولا يتحدث بصوتك بعد. كل شخص يشاهده عبر هاتفه.</p>
  </header>
  <div class="status" id="status" role="status" aria-live="polite">جارٍ تشغيل الكاميرا… إذا لم يظهر طلب الإذن، افتحي الصفحة عبر رابط HTTPS.</div>
  <a-scene
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    <a-assets>
      <img id="sample-card" crossorigin="anonymous" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png">
      <a-asset-item id="sample-avatar" crossorigin="anonymous" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf"></a-asset-item>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-plane src="#sample-card" position="0 0 0" height="0.552" width="1" material="transparent: true"></a-plane>
      <a-gltf-model src="#sample-avatar" position="0 0.04 0.13" rotation="0 0 0" scale="0.005 0.005 0.005"
        animation="property: position; to: 0 0.12 0.13; dur: 1250; easing: easeInOutSine; loop: true; dir: alternate"></a-gltf-model>
    </a-entity>
  </a-scene>
  <script>
    const status = document.getElementById('status');
    const target = document.getElementById('target');
    target.addEventListener('targetFound', () => { status.textContent = 'تم العثور على العلامة — حرّكي الهاتف ببطء لمشاهدة الأفاتار فوقها.'; });
    target.addEventListener('targetLost', () => { status.textContent = 'وجّهي الكاميرا إلى بطاقة الاختبار لإظهار الأفاتار.'; });
    document.querySelector('a-scene').addEventListener('arReady', () => { status.textContent = 'الكاميرا جاهزة — وجّهي الهاتف إلى بطاقة الاختبار.'; });
    document.querySelector('a-scene').addEventListener('arError', () => { status.textContent = 'تعذّر تشغيل الكاميرا. تأكدي من الإذن وافتحي الصفحة عبر HTTPS وعلى متصفح الهاتف.'; });
  </script>
</body>
</html>
